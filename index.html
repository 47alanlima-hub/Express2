        // Área de cobertura: Ribeirão Preto + Sertãozinho, Serrana, Cravinhos e Bonfim Paulista
        const RP_VIEWBOX = "-48.12,-21.02,-47.50,-21.48";

        // Cidades atendidas (usado para validar resultados de geocodificação)
        const CIDADES_ATENDIDAS = ["ribeir", "bonfim", "cravinhos", "serrana", "sertãozinho", "sertaozinho"];

        /* ===================================================================
           ÍNDICE LOCAL DE RUAS (ruas.json)
           Todas as ruas das 4 cidades atendidas, extraídas do OpenStreetMap.
           A busca roda no navegador: sem API, sem limite, sem bloqueio.
           A busca online continua existindo apenas como reserva.
           =================================================================== */

        let indiceRuas = null;
        let promessaIndice = null;

        // Marcas de acento (U+0300 a U+036F) declaradas em ASCII puro,
        // para o codigo nao depender da codificacao do arquivo.
        const RE_ACENTOS = new RegExp(
            '[' + String.fromCharCode(0x0300) + '-' + String.fromCharCode(0x036F) + ']', 'g');

        // Remove acentos e pontuacao
        function normalizar(texto) {
            return (texto || '')
                .normalize('NFD').replace(RE_ACENTOS, '')
                .toLowerCase()
                .replace(/[^a-z0-9\s]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        const PREFIXO_VIA = /^(r|rua|av|avenida|al|alameda|tv|travessa|pc|praca|rod|rodovia|estr|estrada|via|largo|marginal|viela|beco)\s+/;

        // Chave de comparação tolerante a grafias que variam em nomes próprios:
        // Luiz/Luís, Sylvio/Silvio, Theophilo/Teofilo. Aplicada aos dois lados.
        function chaveBusca(texto) {
            return normalizar(texto)
                .replace(/ph/g, 'f')
                .replace(/z/g, 's')
                .replace(/y/g, 'i');
        }

        function carregarIndice() {
            if (promessaIndice) return promessaIndice;
            promessaIndice = fetch('ruas.json')
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(dados => {
                    indiceRuas = dados.ruas.map(([nome, ci, lat, lng, aprox]) => {
                        const chave = chaveBusca(nome);
                        return {
                            nome, lat, lng, aprox,
                            cidade: dados.cidades[ci],
                            chave,
                            nucleo: chave.replace(PREFIXO_VIA, '')
                        };
                    });
                    return indiceRuas;
                })
                .catch(erro => {
                    console.warn('Índice local indisponível, usando busca online:', erro);
                    indiceRuas = [];
                    return indiceRuas;
                });
            return promessaIndice;
        }

        function buscarNoIndice(query) {
            if (!indiceRuas || indiceRuas.length === 0) return [];

            // O usuário digita em qualquer ordem: "Rua X, 288", "288, Rua X",
            // "Rua X 288, Bairro". Então procuramos qual pedaço é a rua em vez
            // de assumir que é sempre o primeiro.
            const partes = query.split(',').map(p => normalizar(p)).filter(Boolean);
            if (partes.length === 0) return [];

            let numero = null;
            let idxRua = -1;
            for (let i = 0; i < partes.length; i++) {
                if (/^\d{1,6}$/.test(partes[i])) {          // pedaço só com número
                    if (!numero) numero = partes[i];
                    continue;
                }
                if (idxRua === -1 && /[a-z]/.test(partes[i])) idxRua = i;
            }
            if (idxRua === -1) return [];

            let textoRua = partes[idxRua];
            const resto = partes.filter((_, i) => i !== idxRua).join(' ');
            const tudo = partes.join(' ');

            // Número grudado no fim da rua ("Rua X 288")
            const comNumero = textoRua.match(/^(.*?)\s+(\d{1,6})$/);
            if (comNumero) {
                textoRua = comNumero[1].trim();
                if (!numero) numero = comNumero[2];
            } else if (!numero) {
                // Número no começo do pedaço seguinte ("1190 - Jardim Bela Vista")
                const n = (partes[idxRua + 1] || '').match(/^(\d{1,6})\b/);
                if (n) numero = n[1];
            }

            if (textoRua.length < 3) return [];

            // Se o usuário citou uma cidade atendida, restringe a ela
            let cidadeFiltro = null;
            for (const c of ['ribeirao preto', 'sertaozinho', 'serrana', 'cravinhos']) {
                if (resto.includes(c) || tudo.includes(c)) { cidadeFiltro = c; break; }
            }

            const nucleoBusca = chaveBusca(textoRua).replace(PREFIXO_VIA, '');
            const termos = nucleoBusca.split(' ').filter(Boolean);
            if (termos.length === 0) return [];

            const achados = [];
            for (const rua of indiceRuas) {
                if (cidadeFiltro && normalizar(rua.cidade) !== cidadeFiltro) continue;
                if (!termos.every(t => rua.chave.includes(t))) continue;

                let pontos = 0;
                if (rua.nucleo === nucleoBusca) pontos += 100;
                else if (rua.nucleo.startsWith(nucleoBusca)) pontos += 60;
                else if (rua.nucleo.includes(nucleoBusca)) pontos += 35;
                else pontos += 15;

                // Entre dois nomes que casam, o mais curto costuma ser o pretendido
                pontos -= Math.min(rua.nucleo.length / 12, 5);
                if (rua.aprox) pontos -= 3;

                achados.push({ rua, pontos });
            }

            achados.sort((a, b) => b.pontos - a.pontos);
            return achados.slice(0, 6).map(a => ({ ...a.rua, numero, isLocal: true }));
        }

        function selectLocalAddress(item) {
            const rotulo = item.numero ? `${item.nome}, ${item.numero}` : item.nome;
            input.value = rotulo;
            suggestionsList.classList.add('hidden');
            statusMsg.classList.add('hidden');

            // Ruas muito longas: o ponto guardado é o centro da via, não o número exato
            renderAddressConfirmation(`${rotulo} - ${item.cidade}`, item.cidade, item.aprox ? 2 : 0);
            renderUnits(item.lat, item.lng);
        }

        const input = document.getElementById('address-input');
        const suggestionsList = document.getElementById('suggestions-list');
        const statusMsg = document.getElementById('status-msg');
        const resultsArea = document.getElementById('results-area');
        const unitsList = document.getElementById('units-list');
        const selectedAddressBox = document.getElementById('selected-address-box');
        const confirmedAddressText = document.getElementById('confirmed-address-text');
        const debugLocation = document.getElementById('debug-location');
        const clearBtn = document.getElementById('clear-btn');
        const resultsTitle = document.getElementById('results-title');

        let debounceTimer;
        let lastFetchedData = [];

        input.addEventListener('input', function() {
            clearTimeout(debounceTimer);
            const query = this.value.trim();
            
            clearBtn.classList.toggle('hidden', query.length === 0);

            const cepRegex = /^[0-9]{5}-?[0-9]{3}$/;
            const simpleCepRegex = /^[0-9]{8}$/;

            if (query.length < 3) {
                suggestionsList.classList.add('hidden');
                return;
            }

            suggestionsList.innerHTML = `
                <li class="px-6 py-8 text-center">
                    <div class="inline-block animate-spin rounded-full h-6 w-6 border-b-2 border-[var(--brand-yellow)] mb-2"></div>
                    <p class="text-xs font-bold text-gray-500 uppercase tracking-wider font-display">Procurando...</p>
                </li>`;
            suggestionsList.classList.remove('hidden');

            if (cepRegex.test(query) || simpleCepRegex.test(query)) {
                debounceTimer = setTimeout(() => fetchByCep(query), 400);
            } else {
                // Índice local responde na hora; só espera mais se precisar da reserva online
                debounceTimer = setTimeout(() => buscarEndereco(query), 180);
            }
        });

        // Busca principal: tenta o índice local e, se não achar, cai para o online
        async function buscarEndereco(query, autoSelect = false) {
            await carregarIndice();

            const locais = buscarNoIndice(query);
            if (locais.length > 0) {
                lastFetchedData = locais;
                if (autoSelect) { selectLocalAddress(locais[0]); return; }
                renderSuggestions(locais, 'local');
                return;
            }

            await fetchSuggestions(query, autoSelect);
        }

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (lastFetchedData.length > 0) {
                    const primeiro = lastFetchedData[0];
                    if (primeiro.isCepResult)   selectCepAddress(primeiro);
                    else if (primeiro.isLocal)  selectLocalAddress(primeiro);
                    else                        selectAddress(primeiro);
                } else {
                    const query = input.value.trim();
                    const cleanQuery = query.replace(/\D/g,'');
                    if(cleanQuery.length === 8) fetchByCep(cleanQuery, true);
                    else buscarEndereco(query, true);
                }
            }
        });

        async function fetchByCep(cep, autoSelect = false) {
            const cleanCep = cep.replace(/\D/g, '');
            const url = `https://brasilapi.com.br/api/cep/v2/${cleanCep}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('CEP não encontrado');
                const data = await response.json();
                
                // A BrasilAPI v2 costuma trazer as coordenadas prontas
                const coords = data.location?.coordinates;

                const cepItem = {
                    display_name: [data.street, data.neighborhood, `${data.city} - ${data.state}`]
                                  .filter(Boolean).join(', '),
                    street: data.street,
                    neighborhood: data.neighborhood,
                    city: data.city,
                    state: data.state,
                    lat: coords?.latitude ? parseFloat(coords.latitude) : null,
                    lng: coords?.longitude ? parseFloat(coords.longitude) : null,
                    isCepResult: true
                };

                lastFetchedData = [cepItem];
                renderSuggestions([cepItem], 'cep');
                if (autoSelect) selectCepAddress(cepItem);

            } catch (error) {
                fetchSuggestions(cep); 
            }
        }

        // Nome da cidade: cidades pequenas (Cravinhos, Serrana, Sertãozinho) voltam
        // como "town"/"village", não como "city".
        function getCityName(address = {}) {
            return address.city || address.town || address.municipality ||
                   address.village || address.county || '';
        }

        function isCidadeAtendida(address) {
            const c = getCityName(address).toLowerCase();
            return CIDADES_ATENDIDAS.some(cidade => c.includes(cidade));
        }

        async function nominatimSearch(q, limit = 8) {
            const url = `https://nominatim.openstreetmap.org/search?format=json` +
                        `&q=${encodeURIComponent(q)}&countrycodes=br` +
                        `&viewbox=${RP_VIEWBOX}&bounded=1&limit=${limit}` +
                        `&addressdetails=1&dedupe=1&accept-language=pt-BR`;
            // O serviço público limita requisições; uma segunda tentativa curta
            // resolve a maioria dos 429/503 sem o usuário perceber.
            for (let tentativa = 0; tentativa < 2; tentativa++) {
                const response = await fetch(url);
                if (response.ok) return response.json();
                if (tentativa === 0) await new Promise(r => setTimeout(r, 700));
            }
            throw new Error('Busca indisponível');
        }

        // Ordena: cidades atendidas primeiro, depois endereços mais específicos
        // (rua com número > rua > bairro), preservando o ranking do Nominatim.
        function rankResults(data) {
            const score = (item) => {
                const a = item.address || {};
                let s = 0;
                if (isCidadeAtendida(a)) s += 100;
                if (a.house_number) s += 10;
                if (a.road || a.pedestrian) s += 5;
                return s;
            };
            return data
                .map((item, i) => ({ item, i, s: score(item) }))
                .sort((x, y) => y.s - x.s || x.i - y.i)
                .map(x => x.item);
        }

        // Evita que uma resposta lenta de uma busca antiga sobrescreva a atual
        let searchToken = 0;

        async function fetchSuggestions(query, autoSelect = false) {
            const meuToken = ++searchToken;
            const cleanQuery = query
                .replace(/nº|numero|número|apto|ap|casa|bloco/gi, " ")
                .replace(/\s+/g, ' ')
                .trim();

            // Sem número da casa: no OSM brasileiro muitos números não existem,
            // e a busca com número volta vazia mesmo com a rua cadastrada.
            const semNumero = cleanQuery.replace(/[,\s]+\d+\s*$/, '').trim();

            // A viewbox já limita à região atendida, então NÃO forçamos a cidade:
            // é isso que permite achar ruas em Cravinhos, Serrana e Sertãozinho.
            const tentativas = [cleanQuery];
            if (semNumero && semNumero !== cleanQuery) tentativas.push(semNumero);

            try {
                let data = [];
                for (const tentativa of tentativas) {
                    data = await nominatimSearch(tentativa);
                    if (meuToken !== searchToken) return; // usuário já digitou outra coisa
                    if (data.length > 0) break;
                }

                data = rankResults(data).slice(0, 6);
                lastFetchedData = data;

                if (data.length === 0) {
                    suggestionsList.innerHTML = `
                        <li class="px-6 py-6 text-center text-gray-500">
                            <i class="fas fa-map-signs text-2xl mb-2 text-gray-700"></i>
                            <p class="text-sm font-medium text-gray-400">Local não encontrado na região.</p>
                            <p class="text-xs text-gray-600 mt-1">Tente <b>Rua + Bairro</b> ou <b>Rua + Cidade</b>, ou busque pelo <b>CEP</b></p>
                        </li>`;
                    return;
                }

                if (autoSelect) { selectAddress(data[0]); return; }
                renderSuggestions(data);

            } catch (error) {
                console.error(error);
                if (meuToken !== searchToken) return;
                suggestionsList.innerHTML = `
                    <li class="px-6 py-6 text-center text-gray-500">
                        <i class="fas fa-triangle-exclamation text-2xl mb-2 text-gray-700"></i>
                        <p class="text-sm font-medium text-gray-400">Busca temporariamente indisponível.</p>
                        <p class="text-xs text-gray-600 mt-1">Tente pelo <b>CEP</b>.</p>
                    </li>`;
            }
        }

        // tipo: 'osm' (busca online) | 'cep' | 'local' (índice de ruas embutido)
        function renderSuggestions(data, tipo = 'osm') {
            const isCep = tipo === 'cep' || tipo === true;   // true: compatibilidade
            const isLocal = tipo === 'local';
            suggestionsList.innerHTML = '';
            data.forEach(item => {
                const li = document.createElement('li');
                
                let mainText = '';
                let subText = '';

                if (isCep) {
                    // CEP geral de cidade não traz rua nem bairro (vinham como "null")
                    mainText = item.street || `${item.city} - ${item.state}`;
                    subText = item.street
                        ? [item.neighborhood, 'CEP encontrado'].filter(Boolean).join(' • ')
                        : 'CEP geral da cidade • localização aproximada';
                } else if (isLocal) {
                    mainText = item.numero ? `${item.nome}, ${item.numero}` : item.nome;
                    subText = item.aprox ? `${item.cidade} • via extensa` : item.cidade;
                } else {
                    const address = item.address || {};
                    mainText = address.road || address.pedestrian || item.display_name.split(',')[0];
                    if (address.house_number) mainText += `, ${address.house_number}`;
                    
                    const details = [];
                    const bairro = address.suburb || address.neighbourhood || address.quarter;
                    if (bairro) details.push(bairro);
                    const cidade = getCityName(address);
                    if (cidade) details.push(cidade);
                    subText = details.join(' • ');
                }

                li.className = "px-4 py-3 hover:bg-[#222] cursor-pointer transition flex items-center gap-3 group border-b border-gray-800 last:border-0";
                li.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-[#333] flex items-center justify-center text-gray-400 group-hover:bg-[var(--brand-yellow)] group-hover:text-black transition-colors shrink-0">
                        <i class="fas ${isCep ? 'fa-check' : 'fa-map-marker-alt'}"></i>
                    </div>
                    <div class="min-w-0">
                        <p class="font-bold text-gray-200 text-sm truncate">${mainText}</p>
                        <p class="text-xs text-gray-500 truncate group-hover:text-gray-400">${subText}</p>
                    </div>
                `;
                
                li.onclick = () => {
                    if (isCep) selectCepAddress(item);
                    else if (isLocal) selectLocalAddress(item);
                    else selectAddress(item);
                };
                suggestionsList.appendChild(li);
            });
            suggestionsList.classList.remove('hidden');
        }

        async function getCoordinatesWithFallback(item) {
            // Monta só as consultas cujas partes existem (CEP geral de cidade não traz rua)
            const partes = (...p) => p.filter(Boolean).join(', ');
            const queries = [
                item.street ? partes(item.street, item.neighborhood, item.city) : null,
                item.street ? partes(item.street, item.city) : null,
                item.neighborhood ? partes(item.neighborhood, item.city) : null,
                item.city
            ];

            for (let i = 0; i < queries.length; i++) {
                if (!queries[i]) continue;
                try {
                    const data = await nominatimSearch(queries[i], 1);
                    if (data.length > 0 && (i === 3 || isCidadeAtendida(data[0].address))) {
                        return { ...data[0], strategyLevel: i };
                    }
                } catch(e){}
            }
            return null;
        }

        async function selectCepAddress(item) {
            input.value = item.display_name;
            suggestionsList.classList.add('hidden');
            
            statusMsg.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i>Afinando localização...';
            statusMsg.classList.remove('hidden');

            // Coordenadas vindas do próprio CEP: mais precisas e sem depender do OSM
            if (item.lat && item.lng) {
                renderAddressConfirmation(item.display_name, item.city, 0);
                renderUnits(item.lat, item.lng);
                return;
            }

            const result = await getCoordinatesWithFallback(item);

            if (result) {
                renderAddressConfirmation(item.display_name, result.address?.city, result.strategyLevel);
                renderUnits(parseFloat(result.lat), parseFloat(result.lon));
            } else {
                showError("Endereço difícil de localizar. Tente buscar pelo nome do bairro.");
            }
        }

        function selectAddress(item) {
            input.value = item.display_name.split(',')[0];
            suggestionsList.classList.add('hidden');
            
            const city = getCityName(item.address) || "Desconhecida";
            renderAddressConfirmation(item.display_name.split(',')[0], city, 0);
            renderUnits(parseFloat(item.lat), parseFloat(item.lon));
        }

        function renderAddressConfirmation(text, city, accuracyLevel) {
            let note = "Localização Exata";
            if (accuracyLevel >= 2) note = "Referência Aproximada (Bairro/Centro)";
            
            confirmedAddressText.textContent = text;
            debugLocation.textContent = `${note} • Cidade: ${city || 'Detectada'}`;
            selectedAddressBox.classList.remove('hidden');
        }

        function renderUnits(userLat = null, userLng = null) {
            let unitsToRender = [...units];
            let hasLocation = userLat !== null && userLng !== null;

            if (hasLocation) {
                unitsToRender = unitsToRender.map(unit => {
                    const d = getDistance(userLat, userLng, unit.lat, unit.lng);
                    return { ...unit, distance: d };
                }).sort((a, b) => a.distance - b.distance);

                if (unitsToRender[0].distance > 80) {
                    showError(`<b>Atenção:</b> Endereço muito longe (${Math.round(unitsToRender[0].distance)}km).<br>Tente digitar apenas o <b>Bairro</b>.`);
                    return;
                }
            }

            unitsList.innerHTML = '';
            
            if (hasLocation) {
                statusMsg.classList.add('hidden');
                resultsTitle.innerText = "Unidades Próximas";
            } else {
                resultsTitle.innerText = "Nossas Unidades";
            }

            unitsToRender.forEach((unit, index) => {
                const isClosest = hasLocation && index === 0;

                const card = document.createElement('div');
                card.className = `card-unit p-5 relative ${isClosest ? 'highlight-closest' : ''}`;
                
                const badge = isClosest 
                    ? `<div class="badge-closest"><i class="fas fa-fire mr-1"></i> Mais Rápida</div>` 
                    : '';

                let distanceHtml = '';
                if (hasLocation) {
                    const distDisplay = unit.distance < 1 
                        ? `${Math.round(unit.distance * 1000)}m` 
                        : `${unit.distance.toFixed(1)}km`;
                    
                    distanceHtml = `
                        <div class="flex flex-col items-center justify-center bg-[#2a2a2a] rounded-lg p-2 min-w-[70px] border border-[#333]">
                            <span class="block font-black text-xl text-white leading-none font-display">${distDisplay}</span>
                            <span class="text-[8px] text-gray-500 uppercase font-bold mt-1 font-display text-center leading-tight">Raio<br>Linear</span>
                        </div>
                    `;
                }

                // Usa o endereço escrito, não as coordenadas: o Google resolve o número
                // exato da loja, enquanto nossas coordenadas são o centro da rua.
                const enderecoLoja = encodeURIComponent(
                    [unit.address, unit.cidade].filter(Boolean).join(', ')
                );

                // Rota do cliente ATÉ a loja (origem = cliente, destino = loja)
                const mapUrl = hasLocation
                    ? `https://www.google.com/maps/dir/?api=1&origin=${userLat},${userLng}&destination=${enderecoLoja}`
                    : `https://www.google.com/maps/search/?api=1&query=${enderecoLoja}`;

                let buttonsHtml = '';
                if (unit.whatsapp) {
                    buttonsHtml = `
                        <div class="flex gap-2 w-full mt-4">
                            <a href="${unit.link}" target="_blank" class="flex-grow btn-yellow font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg group">
                                <i class="fas fa-utensils text-lg"></i>
                                <span class="tracking-wide text-xs md:text-sm font-display">CARDÁPIO</span>
                            </a>
                            <a href="https://wa.me/${unit.whatsapp}" target="_blank" class="w-14 btn-whatsapp font-bold rounded-xl flex items-center justify-center shadow-lg">
                                <i class="fab fa-whatsapp text-2xl"></i>
                            </a>
                            <a href="${mapUrl}" target="_blank" class="w-14 btn-map rounded-xl flex items-center justify-center">
                                <i class="fas fa-location-arrow text-lg"></i>
                            </a>
                        </div>
                    `;
                } else {
                    buttonsHtml = `
                        <div class="flex gap-2 w-full mt-4">
                            <a href="${unit.link}" target="_blank" class="flex-grow btn-yellow font-bold py-3.5 rounded-xl flex items-center justify-center gap-2 shadow-lg group">
                                <i class="fas fa-utensils text-lg"></i>
                                <span class="tracking-wide text-xs md:text-sm font-display">VER CARDÁPIO</span>
                            </a>
                            <a href="${mapUrl}" target="_blank" class="w-14 btn-map rounded-xl flex items-center justify-center">
                                <i class="fas fa-location-arrow text-lg"></i>
                            </a>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${badge}
                    <div class="flex justify-between items-start">
                        <div class="pr-2">
                            <h3 class="text-xl font-bold text-[var(--brand-yellow)] leading-tight tracking-tight">${unit.name}</h3>
                            <p class="text-gray-400 text-xs mt-1 font-medium"><i class="fas fa-map-pin mr-1 opacity-50"></i> ${unit.address}</p>
                            ${unit.cidade ? `<p class="text-gray-500 text-[11px] mt-0.5 font-medium pl-4">${unit.cidade}</p>` : ''}
                        </div>
                        ${distanceHtml}
                    </div>
                    ${buttonsHtml}
                `;
                unitsList.appendChild(card);
            });

            if(hasLocation) {
                setTimeout(() => resultsArea.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
            }
        }

        function showError(msg) {
            statusMsg.innerHTML = `<i class="fas fa-exclamation-circle text-[var(--brand-yellow)] text-xl mb-2 block"></i>${msg}`;
            statusMsg.classList.remove('hidden');
            renderUnits(); 
        }

        function clearSearch() {
            input.value = '';
            input.focus();
            clearBtn.classList.add('hidden');
            suggestionsList.classList.add('hidden');
            selectedAddressBox.classList.add('hidden');
            statusMsg.classList.add('hidden');
            renderUnits();
        }

        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI/180);
            const dLon = (lon2 - lon1) * (Math.PI/180);
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * (Math.PI/180)) * Math.cos(lat2 * (Math.PI/180)) * Math.sin(dLon/2) * Math.sin(dLon/2); 
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)); 
            return R * c;
        }

        document.addEventListener('click', function(e) {
            if (!input.contains(e.target) && !suggestionsList.contains(e.target)) {
                suggestionsList.classList.add('hidden');
            }
        });

        // Carregar unidades imediatamente no carregamento da página
        renderUnits();

        // Baixa o índice de ruas em segundo plano, para a 1ª busca já ser instantânea
        carregarIndice();
    </script>
